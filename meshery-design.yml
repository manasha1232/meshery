name: Simple Web Application Architecture
version: 0.0.1
schemaVersion: designs.meshery.io/v1beta1
description: A production-ready 4-tier cloud-native web application design pattern featuring Ingress routing, NGINX frontend, Node.js API backend, and PostgreSQL database.
components:
  - name: ingress-router
    type: Ingress
    apiVersion: networking.k8s.io/v1
    model: kubernetes
    configuration:
      spec:
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend-service
                      port:
                        number: 80
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: backend-service
                      port:
                        number: 8080

  - name: frontend-service
    type: Service
    apiVersion: v1
    model: kubernetes
    configuration:
      spec:
        selector:
          app: frontend
        ports:
          - port: 80
            targetPort: 8080

  - name: frontend-deployment
    type: Deployment
    apiVersion: apps/v1
    model: kubernetes
    configuration:
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: frontend
        template:
          metadata:
            labels:
              app: frontend
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: web
                image: nginxinc/nginx-unprivileged:alpine
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                ports:
                  - containerPort: 8080

  - name: backend-service
    type: Service
    apiVersion: v1
    model: kubernetes
    configuration:
      spec:
        selector:
          app: backend-api
        ports:
          - port: 8080
            targetPort: 8080

  - name: backend-deployment
    type: Deployment
    apiVersion: apps/v1
    model: kubernetes
    configuration:
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: backend-api
        template:
          metadata:
            labels:
              app: backend-api
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: api
                image: node:22-alpine
                command: ["node", "-e"]
                args:
                  - |
                    const http = require('http');
                    const server = http.createServer((req, res) => {
                      res.writeHead(200, {'Content-Type': 'application/json'});
                      res.end(JSON.stringify({ status: 'ok', service: 'backend-api', time: new Date() }));
                    });
                    server.listen(8080, () => console.log('API listening on 8080'));
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                ports:
                  - containerPort: 8080
                env:
                  - name: DB_HOST
                    value: postgres-service
                  - name: DB_PORT
                    value: "5432"

  - name: postgres-service
    type: Service
    apiVersion: v1
    model: kubernetes
    configuration:
      spec:
        selector:
          app: postgresql
        ports:
          - port: 5432
            targetPort: 5432

  - name: postgres-statefulset
    type: StatefulSet
    apiVersion: apps/v1
    model: kubernetes
    configuration:
      spec:
        serviceName: postgres-service
        replicas: 1
        selector:
          matchLabels:
            app: postgresql
        template:
          metadata:
            labels:
              app: postgresql
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              runAsGroup: 70
              fsGroup: 70
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: postgresql
                image: postgres:15-alpine
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                ports:
                  - containerPort: 5432
                env:
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                  - name: POSTGRES_DB
                    value: appdb
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-credentials
                        key: password
                volumeMounts:
                  - name: postgres-data
                    mountPath: /var/lib/postgresql/data
        volumeClaimTemplates:
          - metadata:
              name: postgres-data
            spec:
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 1Gi
